services:
  glance:
    container_name: glance
    image: glanceapp/glance:v0.8.5
    entrypoint: >
      sh -c "
      echo '🔭 Glance iniciando...';
      if [ -f /run/secrets/glance.env ]; then
        echo '🔐 Cargando secretos desde Vault Agent...';
        export \$$(grep -v '^#' /run/secrets/glance.env | grep -v '^VAULT_' | xargs);
        echo '✅ Variables de API cargadas desde Vault';
      else
        echo '⚠️ Vault Agent no disponible - widgets con API deshabilitados';
      fi;
      exec /app/glance --config /app/config/glance.yml;
      "
    env_file:
      - ../.env
    environment:
      - TZ=${TZ}
    volumes:
      - ./config:/app/config
      - vault_secrets_tmpfs:/run/secrets:ro
    networks:
      - frontend
      # backend: acceso a la API Docker via socket-proxy (widget docker-containers)
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=10m
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.glance.rule=Host(`glance.${DOMAIN_ICARUS}`)"
      - "traefik.http.routers.glance.entrypoints=websecure"
      - "traefik.http.routers.glance.tls=true"
      - "traefik.http.routers.glance.middlewares=authentik-forward-auth@file,security-headers@file"
      - "traefik.http.services.glance.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  vault_secrets_tmpfs:
    external: true
    name: shared-vault-agent_vault_secrets_tmpfs

networks:
  frontend:
    external: true
  backend:
    external: true

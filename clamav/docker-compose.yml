---
services:
  clamav:
    container_name: clamav
    image: docker.io/clamav/clamav:1.5
    profiles:
      - disabled
    env_file:
      - ./.env
    environment:
      - TZ=${TZ}
      # ✅ SEGURIDAD: Variables para optimización ClamAV
      - CLAMAV_NO_FRESHCLAMD=false
      - CLAMAV_NO_CLAMD=false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN            # entrypoint prepara /var/lib/clamav y el socket
      - SETUID           # bajar privilegios a usuario clamav
      - SETGID
      - FOWNER
      - DAC_READ_SEARCH  # leer todo /scan (ro) sin ser dueño; solo lectura, no escritura
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
      - /run:rw,noexec,nosuid,size=10m
    deploy:
      resources:
        limits:
          memory: 3G  # clamd carga la base de firmas completa en RAM
          cpus: '1.0'
    volumes:
      # 🦠 ANTIVIRUS: Acceso completo de lectura para escaneo efectivo
      - /:/scan:ro  # Acceso completo al filesystem del host
      - ./config/clamd.conf:/etc/clamav/clamd.conf:ro
      - ./config/freshclam.conf:/etc/clamav/freshclam.conf:ro
      - clamav-data:/var/lib/clamav
    networks:
      # Solo salida a internet para freshclam; no expone puertos
      - backend
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 1m
      timeout: 30s
      retries: 3
      start_period: 5m  # la carga inicial de firmas es lenta
    restart: unless-stopped

  # 📊 STATS SERVER: Sidecar con stats de escaneos (consumido por Glance)
  clamav-stats:
    container_name: clamav-stats
    image: python:3.14-alpine
    profiles:
      - disabled
    command: ["python3", "/app/clamav-webserver.py"]
    env_file:
      - ./.env
    environment:
      - TZ=${TZ}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=10m
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    volumes:
      - ./clamav-stats.py:/app/clamav-stats.py:ro
      - ./clamav-webserver.py:/app/clamav-webserver.py:ro
      - /var/log/clamav-scans:/var/log/clamav-scans:ro
    # Sin ports: accesible solo dentro de la red frontend (Glance/Prometheus
    # llegan por nombre de contenedor). Antes 8081:8080, colisionaba con cadvisor.
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || python3 -c 'import urllib.request,sys; urllib.request.urlopen(\"http://127.0.0.1:8080/\")' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  clamav-data:

networks:
  backend:
    external: true
  frontend:
    external: true

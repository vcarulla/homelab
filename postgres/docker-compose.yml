---
services:
  postgres:
    image: postgres:18.3-alpine
    container_name: homelab-postgres
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M
    entrypoint: >
      sh -c "
      echo 'PostgreSQL iniciando con Shared Vault Agent...';
      if [ -f /run/secrets/postgres.env ]; then
        echo 'Cargando credenciales desde Vault Agent...';
        export \$$(grep -v '^#' /run/secrets/postgres.env | grep -v '^$$' | grep -v '^VAULT_' | xargs);
        echo 'Credenciales PostgreSQL cargadas desde Vault';
      else
        echo 'ERROR: Vault Agent secrets no disponibles';
        exit 1;
      fi;
      exec docker-entrypoint.sh postgres
      "
    env_file:
      - ../.env
    environment:
      - TZ=${TZ}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - vault_secrets_tmpfs:/run/secrets:ro
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  vault_secrets_tmpfs:
    external: true
    name: shared-vault-agent_vault_secrets_tmpfs

networks:
  database:
    external: true

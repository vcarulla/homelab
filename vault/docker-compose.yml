---
services:
  vault:
    image: hashicorp/vault:2.0.3
    container_name: vault
    env_file:
      - ../.env
    environment:
      - TZ=${TZ}
      - VAULT_ADDR=http://0.0.0.0:8200
      # El binario ya trae cap_ipc_lock de fábrica; el setcap del entrypoint
      # fallaría con read_only
      - SKIP_SETCAP=true
      # Variables API/REDIRECT eliminadas - causan bucle circular con Traefik
    volumes:
      - ./data:/vault/data
      - ./logs:/vault/logs
      - ./config:/vault/config
    networks:
      - frontend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - IPC_LOCK   # mlock: secretos no van a swap
      - CHOWN      # entrypoint hace chown de /vault/logs|config antes de bajar privilegios
      - SETUID     # su-exec root → vault
      - SETGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=10m
    ulimits:
      # Vault 2.0.3 necesita mas memoria bloqueable que 2.0 para mlock;
      # sin esto falla con "Failed to lock memory: cannot allocate memory".
      # Mantiene mlock ACTIVO (secretos no van a swap) en vez de disable_mlock.
      memlock:
        soft: -1
        hard: -1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vault.rule=Host(`vault.${DOMAIN_ICARUS}`)"
      - "traefik.http.routers.vault.entrypoints=websecure"
      - "traefik.http.routers.vault.tls=true"
      - "traefik.http.services.vault.loadbalancer.server.port=8200"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.vault.middlewares=internal-access@file,security-headers@file"
    healthcheck:
      # URL entre comillas: sin ellas, sh interpreta el & como background y el
      # check devuelve siempre 0. Sealed => unhealthy (señal honesta).
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider 'http://127.0.0.1:8200/v1/sys/health?standbyok=true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    command: ["vault", "server", "-config=/vault/config/vault-production.hcl"]
    restart: unless-stopped

networks:
  frontend:
    external: true

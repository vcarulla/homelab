services:
  promtail:
    image: grafana/promtail:3.6.11
    container_name: promtail
    profiles:
      - disabled
    env_file:
      - ../../.env
    environment:
      - TZ=${TZ}
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./config/config.yml:/etc/promtail/config.yml:ro
      # Traefik logs
      - ../../traefik/logs:/var/log/traefik:ro
      # Positions persistentes (en /tmp se perdían al recrear el contenedor)
      - promtail_positions:/positions
    networks:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Los logs json de docker pertenecen a root con modo restrictivo
      - DAC_READ_SEARCH
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "pgrep promtail || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service={{.Name}}"
    command:
      - -config.file=/etc/promtail/config.yml
      - -log.format=json
    restart: unless-stopped

volumes:
  promtail_positions:
    driver: local

networks:
  frontend:
    external: true
  backend:
    external: true

---
# hlab/logging/loki/config/config.yml
# Configuración moderna para Loki en modo single-node con retención.

auth_enabled: false

server:
  http_listen_port: 3100
  log_level: info

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

# Esquema: boltdb-shipper (v12) histórico + migración a tsdb (v13, actual
# recomendado en Loki 3.x). Los datos viejos se siguen leyendo con el schema
# vigente en su fecha.
schema_config:
  configs:
    - from: "2024-01-01"
      store: boltdb-shipper
      object_store: filesystem
      schema: v12
      index:
        prefix: index_
        period: 24h
    - from: "2026-07-15"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: tsdb_index_
        period: 24h

# Almacenamiento para ambos stores
storage_config:
  boltdb_shipper:
    active_index_directory: /loki/boltdb-shipper-active
    cache_location: /loki/boltdb-shipper-cache
    # No es necesario un "shared_store" en modo single-node filesystem
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks

# El compactor es necesario para la retención
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  compaction_interval: 10m
  delete_request_store: filesystem

# Límites y período de retención
limits_config:
  retention_period: 168h  # 7 días
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: false
